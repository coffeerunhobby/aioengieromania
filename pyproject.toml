[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aioengieromania"
version = "0.1.1"
description = "Async client for MyENGIE România accounts: places, meters, invoices, payments and self-readings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "coffeerunhobby" }]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/coffeerunhobby/aioengieromania"
Issues = "https://github.com/coffeerunhobby/aioengieromania/issues"

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov", "mypy"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
